[Controls]
; Quick Controls style for the panel: Qt 6.8+ built-in FluentWinUI3.
; Selected here (instead of QQuickStyle::setStyle) so the choice lives in one
; declarative file embedded at the resource root (:/qtquickcontrols2.conf) —
; see controller_qt/CMakeLists.txt, which attaches this file to the
; desktop-pet-controller-qt target.
;
; NOTE: a Qt build that lacks the FluentWinUI3 QML style module (Ubuntu/
; Debian archive builds omit it) does NOT fall back gracefully — the first
; QtQuick.Controls import fails and Main.qml refuses to load (white screen).
; main.cpp carries a runtime guard that probes
; <QmlImports>/QtQuick/Controls/FluentWinUI3 and pins
; QT_QUICK_CONTROLS_STYLE=Basic when the module is absent; this conf is the
; Windows/official-Qt path.
Style=FluentWinUI3
FallbackStyle=Basic
