# Release pipeline (tag-driven): on pushing a v* tag, build both platforms
# and publish a GitHub Release with multi-platform installers.
#
# Artifacts per release:
#   Windows: DesktopPet-Setup-<tag-no-v>.exe (Inno Setup) + portable zip
#   Linux:   DesktopPet-<tag>-x86_64.AppImage + portable tar.gz
#
# Coexists with ci.yml by design: ci handles push/PR, this handles tags.
# The Qt-install / env-resolution / bootstrap step blocks intentionally
# duplicate ci.yml verbatim — each workflow stays independently readable;
# a workflow_call refactor is deliberately deferred.

name: Release

on:
  push:
    tags: ['v*', '[0-9]*.*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout (submodules recursive - CubismNativeSamples + Framework)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain versions
        run: cmake --version

      # Same Qt install as ci.yml (windows / mingw_64 + tools_ninja +
      # tools_mingw1310): both components pin controller_qt's qt-mingw-qt.cmake.
      - name: Install Qt 6.10 (windows / mingw_64 + ninja + mingw1310_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtcharts qtwebsockets'
          tools: 'tools_ninja tools_mingw1310,qt.tools.win64_mingw1310'

      - name: Qt toolchain env (windows)
        run: |
          echo "QT_PREFIX_PATH=$(cygpath -m "$QT_ROOT_DIR")" >> "$GITHUB_ENV"
          echo "QT_MINGW_ROOT=$(cygpath -m "$(find "$IQTA_TOOLS" -maxdepth 1 -type d -iname 'mingw1310*' | head -n1)")" >> "$GITHUB_ENV"
          QT_NINJA="$(find "$IQTA_TOOLS" -maxdepth 2 -type f -iname 'ninja.exe' | head -n1)"
          echo "QT_NINJA=$(cygpath -m "$QT_NINJA")" >> "$GITHUB_ENV"
          # Fail fast with a readable error if the pinned ninja cannot run.
          "$QT_NINJA" --version
          # PATH fallback for CMake try_compile sub-builds (see ci.yml note).
          echo "$(dirname "$(cygpath -m "$QT_NINJA")")" >> "$GITHUB_PATH"

      # Inno Setup (iscc) for the installer; Vulkan SDK for win-vk-release.
      # The choco vulkansdk package lands in C:\VulkanSDK\<ver> but does not
      # update the current shell — export VULKAN_SDK for find_package(Vulkan).
      - name: Install Inno Setup + Vulkan SDK
        run: |
          choco install -y innosetup vulkan-sdk
          VULKAN_SDK_DIR=$(ls -d /c/VulkanSDK/*/ | head -n1)
          echo "VULKAN_SDK=$(cygpath -m "$VULKAN_SDK_DIR")" >> "$GITHUB_ENV"

      - name: Bootstrap (Cubism Core + GLEW 2.2.0 + GLFW 3.4, idempotent)
        run: cmake -P scripts/Bootstrap.cmake

      - name: Controller (configure + build + tests)
        run: |
          cd controller_qt
          cmake --workflow --preset win-release

      - name: Renderer OpenGL (configure + build + tests)
        run: |
          cd renderer
          cmake --workflow --preset win-gl-release

      # No win-vk-release *workflow* preset exists and release packaging must
      # not edit CMakePresets.json — run the equivalent configure+build+test
      # triplet against the existing vk configure/build/test presets.
      # Optional extra: OpenGL is the default backend; the Vulkan exe is a
      # bonus artifact. The chocolatey vulkan-sdk package has proven
      # flaky on runners (the 'vulkansdk' name 404s in the feed while its
      # package page 200s) — if the SDK fails to provide glslc/Vulkan here,
      # ship the release GL-only instead of blocking it.
      - name: Renderer Vulkan (configure + build + tests)
        continue-on-error: true
        run: |
          # Cubism's SampleShaders WIN32 rule invokes
          # $ENV{VK_SDK_PATH}/Bin/glslc.exe — the LEGACY LunarG variable.
          # choco's vulkan-sdk package only sets VULKAN_SDK; without this
          # alias the shader compile resolves to "/Bin/glslc.exe" and the
          # vk build fails (observed: v2.0.0 shipped GL-only because this
          # step's continue-on-error masked it). Trailing-slash stripped
          # for cleanliness; Windows tolerates either form.
          export VK_SDK_PATH="${VULKAN_SDK%/}"
          cd renderer
          cmake --preset win-vk-release
          cmake --build --preset win-vk-release
          ctest --preset win-vk-release

      - name: Vulkan presence check
        if: runner.os == 'Windows'
        run: |
          # The vk step above is continue-on-error by design (GL is the
          # default backend; a flaky SDK must not block the release) — but
          # shipping GL-only must never be SILENT. Surface a visible
          # annotation on the run when the vk exe never landed in build/bin.
          if [ ! -f build/bin/desktop-pet-renderer-vulkan.exe ]; then
            echo "::warning::desktop-pet-renderer-vulkan.exe missing from build/bin — this release will ship GL-only. Check the 'Renderer Vulkan' step log above."
          else
            echo "Vulkan renderer present: $(ls -la build/bin/desktop-pet-renderer-vulkan.exe | awk '{print $5}') bytes"
          fi

      - name: Portable zip (build/bin minus test artifacts)
        run: |
          mkdir -p dist stage
          # Stage via a tar pipe. NOTE: the original per-file loop ran the
          # `cp` INSIDE the (cd build/bin && ...) subshell, so it staged into
          # build/bin/stage/ — the workspace-root stage/ stayed empty and both
          # Compress-Archive and 7z honestly archived nothing. Keeping both
          # ends of the pipe at distinct cwds makes the paths unambiguous.
          (cd build/bin && tar cf - \
              --exclude=renderer_tests.exe \
              --exclude=desktop-pet-controller-qt-poc.exe \
              --exclude='*.pdb' --exclude='*.lib' \
              .) | (cd stage && tar xf -)
          (cd stage && 7z a "../dist/DesktopPet-$TAG-windows-x64.zip" ./*)
          zip_size=$(wc -c < "dist/DesktopPet-$TAG-windows-x64.zip")
          if [ "$zip_size" -lt 1000000 ]; then
            echo "portable zip is only ${zip_size} bytes — staging failed?" >&2
            ls -laR stage | head -20 >&2
            exit 1
          fi
          ls -la dist/

      - name: Inno Setup installer
        run: |
          if ! command -v iscc >/dev/null 2>&1; then
            export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
          fi
          # MSYS_NO_PATHCONV: git-bash rewrites /DVERSION=... into a Windows
          # path, making iscc see two script filenames ("You may not specify
          # more than one script filename"). BUILD_BIN must also be a
          # Windows-style path — $(pwd) yields POSIX, which iscc cannot use.
          MSYS_NO_PATHCONV=1 iscc /DVERSION="${TAG#v}" \
               /DBUILD_BIN="$(cygpath -m "$(pwd)/build/bin")" \
               packaging/windows/installer.iss
          mv packaging/windows/DesktopPet-Setup-*.exe dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*
          # Transitive handoff to the release job only — the durable copies
          # live on the Release page. 1-day retention keeps the private-repo
          # artifact storage quota (500MB) from filling with ~300MB/run.
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout (submodules recursive - CubismNativeSamples + Framework)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain versions
        run: cmake --version

      - name: Install Qt 6.10 (linux / linux_gcc_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtcharts qtwebsockets'

      # Same apt set as ci.yml plus libvulkan-dev (the vk variant is part of
      # the release product). offscreen for the controller's GUI-app tests.
      - name: System dependencies + headless env
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libvulkan-dev glslang-tools glslc
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: Bootstrap (Cubism Core + GLEW 2.2.0 + GLFW 3.4, idempotent)
        run: cmake -P scripts/Bootstrap.cmake

      - name: Controller (configure + build + tests)
        run: |
          cd controller_qt
          cmake --workflow --preset linux-release

      - name: Renderer OpenGL (configure + build + tests)
        run: |
          cd renderer
          cmake --workflow --preset linux-gl-release

      # Equivalent of the (nonexistent) vk workflow preset — see the Windows
      # twin step for why the triplet form is used.
      - name: Renderer Vulkan (configure + build + tests)
        run: |
          cd renderer
          cmake --preset linux-vk-release
          cmake --build --preset linux-vk-release
          ctest --preset linux-vk-release

      - name: Package (tar.gz + AppImage)
        run: bash packaging/linux/package.sh . "$TAG" dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*
          retention-days: 1

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Gather artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-artifacts'
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
